workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_train_event"
    # Только доверенная конфигурация main: ветки задач никогда не получают sync credentials.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(schedule|web)$/
smoke:
  stage: test
  tags: [merge-train-smoke]
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^merge_(request|train)_event$/
  script:
    - echo smoke ok
sync-github-test:
  stage: test
  tags: [merge-train-smoke]
  script:
    - sh tools/sync-github/sync.test.sh
# Все heads/tags; явное включение после review и первого проверенного запуска.
sync-github:
  stage: deploy
  tags: [$SYNC_RUNNER_TAG]
  rules:
    - if: $FULL_REPO_SYNC_ENABLED == "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(schedule|web)$/ && $GITHUB_SYNC_TOKEN && $GITLAB_SYNC_TOKEN
  resource_group: sync-github
  variables:
    SYNC_RUNNER_TAG: merge-train-smoke
    GITLAB_REPO_URL: $CI_SERVER_URL/$CI_PROJECT_PATH.git
    GITHUB_REPO_URL: https://github.com/dinered/codexpro.git
    SYNC_NOTE_ISSUE: "4"
    SYNC_APPLY: "0" # сначала dry-run; оператор задаёт 1 при проверенном первом запуске
  script:
    - sh tools/sync-github/sync.sh
