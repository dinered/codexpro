workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_train_event"
    # Только доверенная конфигурация main: ветки задач никогда не получают sync credentials.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(schedule|web)$/
smoke:
  stage: test
  tags: [merge-train-smoke]
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^merge_(request|train)_event$/
  script:
    - echo smoke ok
sync-github-test:
  stage: test
  tags: [merge-train-smoke]
  script:
    - sh tools/sync-github/sync.test.sh
discussion-sync-test:
  stage: test
  tags: [merge-train-smoke]
  script:
    - perl tools/discussion-sync/core.test.pl
    - perl tools/discussion-sync/integration.test.pl
discussion-sync-cli-test:
  stage: test
  tags: [merge-train-smoke]
  script:
    - sh -n tools/discussion-sync/bootstrap-cli.sh
    - sh tools/discussion-sync/bootstrap-cli.sh --self-test
    - DISCUSSION_SYNC_BIN_DIR="$CI_PROJECT_DIR/.ci-tools/bin" sh tools/discussion-sync/bootstrap-cli.sh --run sh -ec 'gh --version | grep -F "gh version 2.103.2"; glab --version | grep -F "glab 1.103.0"'
    - sh -n tools/discussion-sync/with-glab-protocol.sh
    - perl tools/discussion-sync/glab-protocol.test.pl "$CI_PROJECT_DIR/.ci-tools/bin/glab" gitlab.home.arpa
# Все heads/tags; явное включение после review и первого проверенного запуска.
sync-github:
  stage: deploy
  tags: [$SYNC_RUNNER_TAG]
  rules:
    - if: $FULL_REPO_SYNC_ENABLED == "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(schedule|web)$/
  resource_group: sync-github
  variables:
    SYNC_RUNNER_TAG: merge-train-smoke
    GITLAB_REPO_URL: $CI_SERVER_URL/$CI_PROJECT_PATH.git
    GITHUB_REPO_URL: https://github.com/dinered/codexpro.git
    SYNC_NOTE_ISSUE: "4"
    SYNC_APPLY: "0" # сначала dry-run; оператор задаёт 1 при проверенном первом запуске
  script:
    - sh tools/sync-github/sync.sh

# Issue/comment backfill remains independently gated. The default is read-only.
discussion-sync:
  stage: deploy
  tags: [$SYNC_RUNNER_TAG]
  rules:
    - if: $DISCUSSION_SYNC_ENABLED == "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(schedule|web)$/
  resource_group: discussion-sync
  variables:
    SYNC_RUNNER_TAG: merge-train-smoke
    DISCUSSION_SYNC_APPLY: "0"
  script:
    - if [ "$DISCUSSION_SYNC_APPLY" = "1" ]; then sh tools/discussion-sync/bootstrap-cli.sh --run sh tools/discussion-sync/with-glab-protocol.sh "$CI_SERVER_FQDN" "$CI_SERVER_PROTOCOL" perl tools/discussion-sync/sync.pl --apply; else sh tools/discussion-sync/bootstrap-cli.sh --run sh tools/discussion-sync/with-glab-protocol.sh "$CI_SERVER_FQDN" "$CI_SERVER_PROTOCOL" perl tools/discussion-sync/sync.pl; fi
